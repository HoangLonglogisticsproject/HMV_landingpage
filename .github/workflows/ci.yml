# Build and test gate for both builds during the migration (docs/architecture/MIGRATION_ROADMAP.md, PR-02): the Vite
# site that production serves today, and the Next.js site. Read-only: no secrets, no deployment, no indexing switch
# (SITE_INDEXABLE is unset, so the Next.js suite also checks the noindex fail-safe).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feat/nextjs-**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit, builds and E2E (Vite and Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0 # same Node.js as development
          cache: npm
      - run: npm ci
      - run: npm run lint # ESLint, then the layer boundaries (scripts/check-boundaries.js)
      - run: npm test
      - run: npm run next:build
      - run: npx playwright install --with-deps chromium
      # With CI set, the Vite configs build their bundle before serving it (playwright*.config.js).
      - run: npx playwright test
      - run: npx playwright test -c playwright.cms.config.js
      - run: npx playwright test -c playwright.next.config.js
      # Last: it rebuilds .next with CMS_CONTENT=true against the mock CMS (tests/next-cms/serve.js).
      - run: npx playwright test -c playwright.next-cms.config.js
      - run: npx playwright test -c playwright.next-cms-stale.config.js

  visual:
    name: Visual baselines (D-14, Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # The image that rendered the baselines (tests/README.md): its browser, fonts and Node.js render the comparison.
      - run: >
          docker run --rm --ipc=host -e CI=true -v "$PWD:/work" -w /work mcr.microsoft.com/playwright:v1.64.1-noble
          bash -c "npm ci --no-audit --no-fund && npx next build && npx playwright test -c playwright.next-visual.config.js"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7
