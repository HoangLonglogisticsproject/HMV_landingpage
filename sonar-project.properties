# SonarQube Cloud, CI-based analysis (.github/workflows/sonarqube.yml).
sonar.organization=hoanglonglogisticsproject
sonar.projectKey=HoangLonglogisticsproject_global-agro-trails

# Production code: the React/Vite application and its HTML entry point.
sonar.sources=src,index.html
# Tests: node:test unit tests and their fixtures next to the code, and the Playwright specs.
sonar.tests=src,tests
sonar.test.inclusions=src/**/*.test.js,src/**/fixtures/**,tests/**
sonar.exclusions=src/**/*.test.js,src/**/fixtures/**

sonar.sourceEncoding=UTF-8

# Coverage: `npm run test:coverage` (node --test with Node's built-in V8 coverage) writes this LCOV before the scan.
# Only modules the unit tests load are in it; every other source file counts as uncovered.
sonar.javascript.lcov.reportPaths=lcov.info

# Copy-paste detection skips src/data/about.js only: it is static content, the EN and VI About copy as two objects of
# the same shape (the CMS `about` page contract). CPD ignores string literals, so the two languages match as one
# 149-line duplicated block. Code is still analysed for issues; only duplication detection is skipped for this file.
sonar.cpd.exclusions=src/data/about.js
