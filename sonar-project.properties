# SonarQube Cloud, CI-based analysis (.github/workflows/sonarqube.yml).
sonar.organization=hoanglonglogisticsproject
sonar.projectKey=HoangLonglogisticsproject_global-agro-trails

# Production code: shared and Vite code in src with its HTML entry point, and the Next.js app (routes, proxy, config).
sonar.sources=src,index.html,app,proxy.ts,next.config.ts
# Tests: Vitest unit tests and their fixtures next to the code, and the Playwright specs.
sonar.tests=src,tests
sonar.test.inclusions=src/**/*.test.js,src/**/fixtures/**,tests/**
sonar.exclusions=src/**/*.test.js,src/**/fixtures/**

sonar.sourceEncoding=UTF-8

# Coverage: `npm run test:coverage` (Vitest, V8 provider; vite.config.js `test.coverage`) writes this LCOV before the scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# src/data/about.js is static content, the EN and VI About copy (one exported object literal): no logic to cover.
sonar.coverage.exclusions=src/data/about.js

# Copy-paste detection skips localized static content whose languages share a content schema on purpose. CPD ignores
# string literals, so structurally equivalent translations are counted as duplicated code:
# - src/data/about.js: the EN and VI About copy, two objects of the same shape (the CMS `about` page contract; one
#   149-line block);
# - src/data/cassavaChina.js and src/data/cassavaKorea.js: the Chinese and Korean copy of the cassava procurement page,
#   one content shape for every language (views/products/CassavaProcurement);
# - src/data/articles.js and src/data/cassavaChinaGuides.js: the bundled EcoNews articles (each one's EN and VI bodies)
#   and the Chinese cassava guides, copy blocks of one format (['h2' | 'p', text], ['ul', [[bold, text]]]).
# Only duplication detection skips them: they stay in sonar.sources for issue and security analysis, and in coverage.
sonar.cpd.exclusions=src/data/about.js,src/data/cassavaChina.js,src/data/cassavaKorea.js,src/data/articles.js,src/data/cassavaChinaGuides.js
